<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
  <title>
   Practice &amp; Quiz — StudyMate
  </title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <style>
   :root {
    --bg:#F6F5FA;
    --card:#fff;
    --p:#6D4AE8;
    --pd:#5636C9;
    --pl:#F0ECFD;
    --line:#E7E4F0;
    --text:#17151F;
    --muted:#6C6880;
    --on:#fff;
    --ok:#1F8A5B;
    --okl:#E6F5EE;
    --bad:#D6455D;
    --badl:#FDEBEE;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark) {
    :root:not([data-theme="light"]) {
        --bg:#100E17;
        --card:#191624;
        --p:#9B82FF;
        --pd:#B9A8FF;
        --pl:#252038;
        --line:#2C2740;
        --text:#EEEBF7;
        --muted:#9A94AE;
        --on:#14101F;
        --okl:#17332A;
        --badl:#3A1D25
    }
}
:root[data-theme="dark"] {
    --bg:#100E17;
    --card:#191624;
    --p:#9B82FF;
    --pd:#B9A8FF;
    --pl:#252038;
    --line:#2C2740;
    --text:#EEEBF7;
    --muted:#9A94AE;
    --on:#14101F;
    --okl:#17332A;
    --badl:#3A1D25
}
* {
    margin:0;
    padding:0;
    box-sizing:border-box
}
html {
    scroll-padding-top:env(safe-area-inset-top,0px)
}
body {
    font-family:'Inter',system-ui,sans-serif;
    font-size:15px;
    line-height:1.55;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased
}
h1,h2,h3 {
    font-weight:700;
    letter-spacing:-.02em;
    line-height:1.2
}
button {
    font-family:inherit;
    cursor:pointer
}
:focus-visible {
    outline:3px solid var(--p);
    outline-offset:2px
}
.hide {
    display:none!important
}
label {
    display:block;
    font-size:13px;
    font-weight:600;
    margin:14px 0 6px
}
input,select {
    width:100%;
    padding:11px 14px;
    border:1px solid var(--line);
    border-radius:10px;
    font:inherit;
    font-size:14px;
    background:var(--card);
    color:var(--text)
}
input:focus,select:focus {
    border-color:var(--p);
    outline:none;
    box-shadow:0 0 0 3px var(--pl)
}
.btn {
    display:inline-block;
    background:var(--p);
    color:var(--on);
    border:0;
    border-radius:10px;
    padding:11px 18px;
    font-weight:600;
    font-size:14px;
    transition:background .15s
}
.btn:hover {
    background:var(--pd);
    color:var(--on)
}
.btn.full {
    width:100%;
    margin-top:20px
}
.btn.ghost {
    background:var(--pl);
    color:var(--pd)
}
.btn.ghost:hover {
    background:var(--line);
    color:var(--pd)
}

/* auth */
#login {
    position:fixed;
    inset:0;
    z-index:50;
    background:var(--card);
    display:flex
}
.lp {
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px
}
.logo {
    text-align:center;
    margin-bottom:28px
}
.logo i {
    width:52px;
    height:52px;
    border-radius:15px;
    background:var(--p);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    font-style:normal;
    margin:0 auto 12px
}
.logo b {
    font-size:22px;
    letter-spacing:-.02em;
    display:block
}
.logo p {
    font-size:13px;
    color:var(--muted)
}
.fbox {
    width:100%;
    max-width:380px
}
.fbox h2 {
    font-size:26px;
    margin-bottom:4px
}
.fbox>p {
    color:var(--muted);
    font-size:14px;
    margin-bottom:8px
}
.rp {
    flex:1;
    background:var(--pl);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px;
    text-align:center
}
.rp .big {
    font-size:64px
}
.rp h2 {
    font-size:28px;
    margin:12px 0
}
.rp ul {
    list-style:none;
    max-width:320px;
    margin:24px auto 0;
    text-align:left;
    display:grid;
    gap:10px
}
.rp li {
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    font-size:14px
}

/* site header + page */
.sl {
    display:flex;
    align-items:center;
    gap:10px;
    font-size:18px;
    font-weight:700;
    letter-spacing:-.02em
}
.sl i {
    width:34px;
    height:34px;
    border-radius:10px;
    background:var(--p);
    display:grid;
    place-items:center;
    font-size:18px;
    font-style:normal
}
aside {
    position:sticky;
    top:0;
    z-index:10;
    display:flex;
    align-items:center;
    gap:28px;
    height:66px;
    padding:0 max(5vw,20px);
    background:var(--card);
    border-bottom:1px solid var(--line)
}
aside nav {
    flex:1;
    display:flex;
    gap:4px
}
nav button {
    display:flex;
    align-items:center;
    gap:6px;
    width:auto;
    margin:0;
    padding:8px 14px;
    border:0;
    border-radius:99px;
    background:none;
    color:var(--muted);
    font-size:14px;
    font-weight:500;
    white-space:nowrap
}
nav button:hover {
    background:var(--bg);
    color:var(--text)
}
nav button.on {
    background:var(--pl);
    color:var(--pd);
    font-weight:600
}
.su {
    padding:0;
    border:0;
    font-size:13px;
    display:flex;
    gap:10px;
    align-items:center;
    white-space:nowrap
}
.su i {
    font-style:normal;
    width:34px;
    height:34px;
    border-radius:50%;
    background:var(--pl);
    display:grid;
    place-items:center
}
main {
    margin:0 auto;
    padding:40px 5vw 56px;
    max-width:1120px
}
main::after {
    content:"🎓 StudyMate · Junior Design Project · Built with Retrieval-Augmented Generation";
    display:block;
    text-align:center;
    font-size:13px;
    color:var(--muted);
    margin-top:56px;
    padding-top:20px;
    border-top:1px solid var(--line)
}
.top {
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:28px;
    padding-bottom:20px;
    border-bottom:1px solid var(--line)
}
.top h1 {
    font-size:34px
}
.top p {
    color:var(--muted);
    font-size:14px;
    margin-top:2px
}
.chip {
    display:inline-flex;
    gap:6px;
    align-items:center;
    background:var(--pl);
    color:var(--pd);
    border-radius:99px;
    padding:6px 14px;
    font-size:13px;
    font-weight:600;
    border:0
}
.grid {
    display:grid;
    gap:16px
}
.g4 {
    grid-template-columns:repeat(auto-fit,minmax(170px,1fr))
}
.g2 {
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr))
}
.card {
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px
}
.card h3 {
    font-size:16px;
    margin-bottom:12px
}
.stat span {
    font-size:13px;
    color:var(--muted);
    display:block
}
.stat b {
    display:block;
    font-size:30px;
    letter-spacing:-.02em;
    margin-top:4px
}
.mood {
    display:flex;
    gap:8px;
    flex-wrap:wrap
}
.mood button {
    font-size:26px;
    width:52px;
    height:52px;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--card)
}
.mood button:hover {
    border-color:var(--p)
}
.mood button.on {
    border-color:var(--p);
    background:var(--pl)
}
.mnote {
    margin-top:12px;
    font-size:13px;
    color:var(--muted);
    min-height:40px
}
.quote {
    background:var(--pl);
    border-radius:16px;
    padding:22px
}
.quote q {
    display:block;
    font-size:18px;
    font-weight:600;
    line-height:1.45;
    letter-spacing:-.01em;
    margin:8px 0;
    quotes:none
}
.quote small {
    color:var(--muted);
    font-weight:500
}
.cycle {
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    font-size:13px;
    font-weight:600;
    color:var(--muted)
}
.cycle span {
    background:var(--pl);
    color:var(--pd);
    border-radius:99px;
    padding:6px 14px
}
.cycle span.now {
    background:var(--p);
    color:var(--on)
}
.bar {
    height:8px;
    border-radius:99px;
    background:var(--pl);
    overflow:hidden;
    margin:6px 0 14px
}
.bar div {
    height:100%;
    border-radius:99px;
    background:var(--p)
}
.bar div.lo {
    background:var(--bad)
}
.bar div.hi {
    background:var(--ok)
}
.row {
    display:flex;
    justify-content:space-between;
    font-size:13px;
    gap:8px
}
.tag {
    font-size:12px;
    font-weight:600;
    border-radius:99px;
    padding:3px 10px;
    background:var(--pl);
    color:var(--pd)
}
.tag.ok {
    background:var(--okl);
    color:var(--ok)
}
.tag.bad {
    background:var(--badl);
    color:var(--bad)
}
.drop {
    border:1.5px dashed var(--line);
    border-radius:12px;
    padding:16px;
    text-align:center;
    cursor:pointer;
    font-size:13px;
    color:var(--muted);
    display:block;
    margin-top:14px;
    font-weight:500
}
.drop:hover,.drop:focus-within {
    border-color:var(--p);
    background:var(--pl);
    color:var(--pd)
}
.drop input {
    display:none
}
.file {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    border-top:1px solid var(--line);
    padding:10px 0;
    font-size:13px
}
.empty {
    color:var(--muted);
    font-size:13px;
    padding:8px 0
}
.form {
    display:grid;
    grid-template-columns:1fr 2fr auto;
    gap:12px;
    align-items:end
}
.form label {
    margin-top:0
}

/* chat */
.chat {
    display:flex;
    flex-direction:column;
    height:calc(100vh - 230px);
    min-height:420px
}
.msgs {
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:12px
}
.m {
    max-width:78%;
    padding:11px 14px;
    border-radius:14px;
    font-size:14.5px
}
.m.u {
    align-self:flex-end;
    background:var(--p);
    color:var(--on);
    border-bottom-right-radius:4px
}
.m.b {
    background:var(--bg);
    border:1px solid var(--line);
    border-bottom-left-radius:4px
}
.src {
    display:inline-block;
    margin:8px 6px 0 0;
    font-size:12px;
    font-weight:500;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:99px;
    padding:3px 10px;
    color:var(--pd)
}
.modes {
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:14px
}
.modes button {
    border:1px solid var(--line);
    background:var(--card);
    color:var(--text);
    border-radius:99px;
    padding:7px 14px;
    font-size:13px;
    font-weight:500
}
.modes button.on {
    background:var(--p);
    border-color:var(--p);
    color:var(--on)
}
.send {
    display:flex;
    gap:8px;
    margin-top:14px
}

/* quiz */
.opt {
    display:block;
    width:100%;
    text-align:left;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--text);
    border-radius:12px;
    padding:13px 16px;
    margin-top:8px;
    font-size:14px
}
.opt:hover {
    border-color:var(--p)
}
.opt.sel {
    border-color:var(--p);
    background:var(--pl)
}
.rev {
    border-left:3px solid var(--bad);
    background:var(--badl);
    border-radius:8px;
    padding:12px 14px;
    margin-top:12px;
    font-size:13px
}
.tb {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px
}
.cta {
    background:var(--pl);
    border-radius:20px;
    margin-bottom:48px
}
@media(max-width:820px) {
    #login .rp {
        display:none
    }
    aside {
        gap:10px;
        padding:0 12px;
        height:58px;
        overflow-x:auto
    }
    .sl {
        font-size:0
    }
    .sl i {
        font-size:18px
    }
    .su {
        display:none
    }
    main {
        padding:24px 16px 48px
    }
    .top h1 {
        font-size:26px
    }
    .form {
        grid-template-columns:1fr
    }
    .m {
        max-width:92%
    }
}

/* study buddy touches */
.m.b {
    margin-left:40px;
    position:relative
}
.m.b::before {
    content:"🦉";
    position:absolute;
    left:-40px;
    top:0;
    width:32px;
    height:32px;
    border-radius:50%;
    background:var(--card);
    border:1px solid var(--line);
    display:grid;
    place-items:center;
    font-size:17px
}
.demo .m.b {
    margin-left:40px
}
.goal .bar {
    height:12px;
    margin:8px 0 12px
}
.goal p {
    font-size:14px;
    color:var(--muted)
}

/* motivation banner */
.banner {
    display:flex;
    align-items:center;
    gap:26px;
    background:var(--pl);
    border:2px solid color-mix(in srgb,var(--p) 45%,var(--line));
    border-radius:20px;
    padding:22px 28px;
    margin-bottom:24px
}
.banner .art {
    position:relative;
    flex:none;
    width:104px;
    height:104px;
    border-radius:50%;
    background:var(--card);
    display:grid;
    place-items:center;
    font-size:58px
}
.banner .art i {
    position:absolute;
    font-style:normal;
    font-size:20px
}
.banner .a1 {
    top:-4px;
    left:-6px
}
.banner .a2 {
    top:0;
    right:-8px
}
.banner .a3 {
    bottom:2px;
    left:-10px
}
.banner .a4 {
    bottom:-2px;
    right:-4px
}
.banner h2 {
    font-size:22px;
    color:var(--pd);
    margin-bottom:4px
}
.banner p {
    color:var(--muted);
    font-size:14.5px
}
.banner .btn {
    flex:none
}
@media(max-width:820px) {
    .banner {
        flex-direction:column;
        text-align:center;
        padding:22px 18px
    }
}
.banner .art {
    width:120px;
    height:120px;
    background:none;
    border-radius:0;
    display:block
}
.banner .art svg {
    width:100%;
    height:100%
}

/* user menu */
.su {
    position:relative
}
.ub {
    display:flex;
    align-items:center;
    gap:10px;
    background:none;
    border:0;
    padding:4px 8px;
    border-radius:12px;
    color:var(--text);
    text-align:left;
    font-size:13px;
    line-height:1.3
}
.ub:hover {
    background:var(--bg)
}
.ub small {
    color:var(--muted);
    font-size:12px
}
.um {
    position:fixed;
    top:62px;
    right:max(5vw,20px);
    width:210px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:6px;
    box-shadow:0 18px 40px -20px rgba(23,21,31,.45);
    z-index:30
}
.um a,.um button {
    display:block;
    width:100%;
    text-align:left;
    padding:10px 12px;
    border:0;
    background:none;
    border-radius:9px;
    color:var(--text);
    font-size:14px;
    text-decoration:none
}
.um a:hover,.um button:hover {
    background:var(--pl)
}
.um #lo {
    color:var(--bad)
}
@media(max-width:820px) {
    .su {
        display:flex
    }
    .ub span,.ub b {
        display:none
    }
    .um {
        right:12px
    }
}
textarea {
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:12px;
    font:inherit;
    font-size:14px;
    background:var(--card);
    color:var(--text);
    resize:vertical;
    margin-top:10px
}
textarea:focus {
    border-color:var(--p);
    outline:none;
    box-shadow:0 0 0 3px var(--pl)
}
  </style>
 </head>
 <body data-page="quiz">

    </i>

  <main>
   <section id="v-quiz">
    <div class="top">

       </select>

        </option>

        <option>

        </option>
       </select>
       <label for="qtm">
        Time limit
       </label>
       <select id="qtm">
        <option>

        </option>
        <option>

        </option>
        <option>
         5 min
        </option>
        <option>
         10 min
        </option>
       </select>
      </div>
     </div>
     <button class="btn full" id="qgo">
      🚀 Generate quiz
     </button>
     <p style="font-size:12px;color:var(--muted);margin-top:10px">
      Demo note: questions here are samples. In the full system they are generated from your retrieved material.
     </p>
    </div>
    <div class="card hide" id="qrun">
    </div>
    <div class="hide" id="qres">
    </div>
   </section>
  </main>
